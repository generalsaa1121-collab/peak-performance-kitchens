name: Build and publish site

# Builds the site and publishes the static output to the `gh-pages` branch on
# every push to main. This works with the default GITHUB_TOKEN (contents:write)
# and needs no repository settings change.
#
# The published branch is immediately servable via a GitHub CDN, e.g.:
#   https://raw.githack.com/<owner>/<repo>/gh-pages/index.html
#   https://cdn.jsdelivr.net/gh/<owner>/<repo>@gh-pages/index.html
#
# To also serve it at the canonical github.io URL, enable GitHub Pages once:
#   Settings → Pages → Build and deployment → Source: "Deploy from a branch"
#   → Branch: gh-pages / (root).  Then it is live at
#   https://<owner>.github.io/<repo>/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare static output
        run: |
          cp dist/index.html dist/404.html   # SPA / refresh fallback
          touch dist/.nojekyll               # serve as-is (no Jekyll)

      - name: Publish to gh-pages branch
        run: |
          cd dist
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.email=github-actions@users.noreply.github.com \
              -c user.name="github-actions[bot]" \
              commit -qm "Deploy ${GITHUB_SHA}"
          git push -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
