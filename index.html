<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- FAVICON + app icon: official mountain icon badge. %BASE_URL% is replaced
         by Vite with the deployment base path so it resolves on GitHub Pages. -->
    <link rel="icon" type="image/png" href="%BASE_URL%logos/03_icon-mountain-badge.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%logos/03_icon-mountain-badge.png" />

    <!-- Optimized font loading: preconnect + display=swap.
         Display face: Sora (athletic, premium). Body face: Inter (clean, readable). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Peak Performance Kitchens — Healthy Ingredients + Real Results + Better You</title>
    <meta
      name="description"
      content="Chef-prepared meal prep with balanced nutrition, quality ingredients, and the convenience to keep your goals moving forward. Healthy Ingredients + Real Results + Better You."
    />
    <meta name="theme-color" content="#0B0B0C" />

    <!-- Open Graph / social preview. Update og:url + og:image if you deploy to a
         custom domain (these point at the current GitHub Pages URL). -->
    <meta property="og:title" content="Peak Performance Kitchens" />
    <meta
      property="og:description"
      content="Healthy Ingredients + Real Results + Better You. Chef-prepared performance meal prep."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://generalsaa1121-collab.github.io/peak-performance-kitchens/" />
    <meta
      property="og:image"
      content="https://generalsaa1121-collab.github.io/peak-performance-kitchens/logos/01_logo-badge-primary-dark-tagline.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Peak Performance Kitchens" />
    <meta
      name="twitter:description"
      content="Healthy Ingredients + Real Results + Better You. Chef-prepared performance meal prep."
    />
    <meta
      name="twitter:image"
      content="https://generalsaa1121-collab.github.io/peak-performance-kitchens/logos/01_logo-badge-primary-dark-tagline.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
